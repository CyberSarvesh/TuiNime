[package]
name = "tuinime"
version = "0.1.0"
edition = "2021"
description = "Browse and stream anime from your terminal: posters, search, episode lists, and playback in mpv"
authors = ["TuiNime contributors"]
license = "MIT"
repository = "https://github.com/CyberSarvesh/TuiNime"
homepage = "https://github.com/CyberSarvesh/TuiNime"
readme = "README.md"
keywords = ["tui", "anime", "streaming", "ratatui", "mpv"]
categories = ["command-line-utilities", "multimedia"]
# keep the crates.io download small; the README's images load from GitHub
exclude = ["docs/media/*", "docs/tools/*"]

[[bin]]
name = "tuinime"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Terminal graphics & posters — Kitty / Sixel / halfblock fallback
ratatui-image = { version = "3.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Networking & API
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Scraping & parsing
scraper = "0.24"
base64 = "0.22"

# Utilities
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
bytes = "1"
dirs = "6.0"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
